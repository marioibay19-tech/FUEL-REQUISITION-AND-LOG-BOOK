# Local or single-server deployment. Put secrets in a .env file next to this one.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fueltrack
      POSTGRES_USER: fueltrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fueltrack"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fueltrack:${POSTGRES_PASSWORD}@db:5432/fueltrack?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads
volumes:
  pgdata:
  uploads:
